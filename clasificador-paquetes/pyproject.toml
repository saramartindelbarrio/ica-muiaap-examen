[project]
name = "clasificador-paquetes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sara", email = "sara.martin.delbarrio@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "pydantic>=2.14.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.scripts]
clasificador-paquetes = "clasificador_paquetes:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
